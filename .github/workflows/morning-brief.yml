name: Morning Briefing

on:
  schedule:
    # 매일 22:00 UTC = 07:00 KST 다음날
    - cron: "0 22 * * *"
  workflow_dispatch: # 수동 실행 허용

env:
  TZ: Asia/Seoul

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r dima-briefing/requirements.txt

      - name: Run briefing
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APPPASS: ${{ secrets.GMAIL_APPPASS }}
          GCAL_ICAL_URL: ${{ secrets.GCAL_ICAL_URL }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: |
          python3 dima-briefing/briefing_run.py
